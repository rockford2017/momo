name: Selfbot Keep Alive Runner

on:
  schedule:
    - cron: '0 */5 * * *'  # Runs automatically every 5 hours
  workflow_dispatch:

jobs:
  run-selfbot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Selfbot Script
      env:
        SESSION_STRING: ${{ secrets.SESSION_STRING }}
      run: |
        python bot.py
